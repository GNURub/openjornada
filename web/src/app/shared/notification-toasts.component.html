@if (visible() && toasts().length > 0) {
  <section
    aria-label="Avisos nuevos"
    aria-live="polite"
    class="fixed inset-x-3 top-3 z-50 flex flex-col gap-3 sm:inset-x-auto sm:right-5 sm:top-20 sm:w-96"
  >
    @for (notification of toasts(); track notification.id) {
      <article
        class="rounded-2xl border border-stone-200 bg-white p-4 text-stone-950 shadow-2xl"
        data-testid="notification-toast"
      >
        <div class="flex items-start gap-3">
          <span aria-hidden="true" class="mt-1.5 size-2 shrink-0 rounded-full bg-coral-500"></span>
          <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-3">
              <p class="font-semibold">{{ notification.title }}</p>
              <time class="shrink-0 text-[11px] text-stone-400">{{
                formatTime(notification.created)
              }}</time>
            </div>
            <p class="mt-1 line-clamp-3 text-sm leading-6 text-stone-500">
              {{ notification.message }}
            </p>
            <div class="mt-3 flex flex-wrap gap-2">
              <button
                type="button"
                (click)="open(notification)"
                class="rounded-xl bg-coral-600 px-3 py-1.5 text-sm font-semibold text-white transition hover:bg-coral-700"
              >
                Ver
              </button>
              <button
                type="button"
                (click)="notifications.markRead(notification.id)"
                class="rounded-xl px-3 py-1.5 text-sm font-semibold text-stone-500 transition hover:bg-stone-100 hover:text-stone-900"
              >
                Marcar como leído
              </button>
            </div>
          </div>
          <button
            type="button"
            aria-label="Cerrar este aviso"
            (click)="notifications.dismiss(notification.id)"
            class="grid size-7 shrink-0 place-items-center rounded-full text-stone-400 transition hover:bg-stone-100 hover:text-stone-900"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </article>
    }
    @if (hidden() > 0) {
      <a
        routerLink="/avisos"
        class="self-end rounded-xl bg-stone-900 px-3 py-2 text-sm font-semibold text-white shadow-xl"
      >
        Ver los {{ notifications.pending().length }} avisos
      </a>
    }
  </section>
}
