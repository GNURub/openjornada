services:
  app:
    build:
      context: .
      args:
        PB_VERSION: "0.39.10"
    env_file:
      - .env
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - pocketbase_data:/app/pb_data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pocketbase_data:
