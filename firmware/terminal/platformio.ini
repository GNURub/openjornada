[platformio]
default_envs = m5stack_dev

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@7.4.2
build_src_filter =
  +<app/>
  +<domain/>
  +<network/>
  +<provisioning/>
  +<storage/>
  +<ui/text_fit.cpp>
  -<main.cpp>

[m5stack_base]
platform = espressif32@6.7.0
board = m5stack-core-esp32
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
  m5stack/M5Unified@0.2.8
  m5stack/M5GFX@0.2.11
  bblanchon/ArduinoJson@7.4.2
  https://github.com/kkloesener/MFRC522_I2C.git#8152dddc93cf743397ac225e34bf268698326664

[env:m5stack_dev]
extends = m5stack_base
build_flags =
  ${m5stack_base.build_flags}
  -DOPENJORNADA_DEVELOPMENT=1

[env:m5stack_release]
extends = m5stack_base
build_flags =
  ${m5stack_base.build_flags}
  -DOPENJORNADA_DEVELOPMENT=0
