services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/app/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pocketbase_data:
